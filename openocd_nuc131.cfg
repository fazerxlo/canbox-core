# OpenOCD Configuration for Nuvoton NUC131 via ST-Link V2
# Target: Raise CAN Box (NUC131SD2AE / NUC131SC2AE)
# Interface: ST-LINK with ARM CoreSight DAP transport

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# Operating adapter speed (safe 500 kHz; supports up to 950 kHz)
adapter speed 500

# NuMicro Cortex-M0 target configuration
# (Note: In target/numicro.cfg, the override variable is CPUDAPID)
set CPUDAPID 0x0BB11477
source [find target/numicro.cfg]

# Immediately configure GPIO pins on reset-init/halt to silence buzzer and isolate CAN transceiver
$_TARGETNAME configure -event reset-init {
    # Disconnect CAN0 peripheral from PD6/PD7 (GPD_MFP = 0)
    mww 0x5000003C 0x00000000
    # Silence buzzer, assert CAN transceiver standby (PC3=1, PC0/1/2/6/7=1)
    mww 0x50004088 0x000000CF
    mww 0x50004080 0x0000F045
    # Enforce CAN_TX recessive HIGH (PD7=1 Push-Pull, PD6=Input)
    mww 0x500040C8 0x000000C0
    mww 0x500040C0 0x00007000
    # Silence buzzer pins PB3/PB12
    mww 0x50004048 0x0000113F
    mww 0x50004040 0x43030FF4
    # All auxiliary outputs OFF, ACC ON to keep HU awake
    mww 0x50004008 0x00004DFF
    mww 0x50004000 0x75F5FF0F
}


