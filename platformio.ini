[platformio]
default_envs = native_test_runner, integration_test, native_test

[env]
extra_scripts = pre:tools/generate_version.py
build_flags =

[env:native_test_runner]
platform = native
test_framework = unity
test_build_src = yes
build_flags = 
    ${env.build_flags}
    -Iinclude
    -Isrc
    -DPLATFORM_LINUX
    -D_GNU_SOURCE
    -D_DEFAULT_SOURCE
    -g3
    -Wall -Wextra -std=c99
build_src_filter = 
    +<core/*>
    +<profiles/*>
    +<protocols/*>
    +<hal/hal_native/*>
test_filter = test_protocol_parser

[env:integration_test]
platform = native
test_framework = unity
test_build_src = yes
build_flags = 
    ${env.build_flags}
    -Iinclude
    -Isrc
    -DPLATFORM_LINUX
    -D_GNU_SOURCE
    -D_DEFAULT_SOURCE
    -g3
    -Wall -Wextra -std=c99
build_src_filter = 
    +<core/*>
    +<profiles/*>
    +<protocols/*>
    +<hal/hal_native/*>
test_filter = test_integration

[env:native_test]
platform = native
test_ignore = *
build_flags = 
    ${env.build_flags}
    -Iinclude
    -Isrc
    -DPLATFORM_LINUX
    -D_GNU_SOURCE
    -D_DEFAULT_SOURCE
    -Wall -Wextra -std=c99
build_src_filter = 
    +<main.c>
    +<core/*>
    +<profiles/*>
    +<protocols/*>
    +<hal/hal_native/*>

[env:stm32_cbox]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
test_ignore = *
build_flags = 
    ${env.build_flags}
    -Iinclude
    -Isrc
    -DPLATFORM_STM32
    -DUSE_FULL_LL_DRIVER
    -Wall -Wextra -std=c99
build_src_filter = 
    +<main.c>
    +<core/*>
    +<profiles/*>
    +<protocols/*>
    +<hal/hal_stm32/*>

[env:esp32_cbox]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
test_ignore = *
build_flags = 
    ${env.build_flags}
    -Iinclude
    -Isrc
    -DPLATFORM_ESP32
    -Wall -Wextra -std=c99
build_src_filter = 
    +<core/*>
    +<profiles/*>
    +<protocols/*>
    +<hal/hal_esp32/*>
    +<main_esp32.c>

[env:hiworld_stm32f105]
platform = ststm32
board = eval_f107vc
framework = stm32cube
test_ignore = *
board_upload.offset_address = 0x08007000
build_flags = 
    ${env.build_flags}
    -Iinclude
    -Isrc
    -DPLATFORM_STM32
    -DSTM32F105xC
    -DUSE_FULL_LL_DRIVER
    -DVECT_TAB_OFFSET=0x7000
    -Wl,--section-start=.isr_vector=0x08007000
    -Wall -Wextra -std=c99
build_src_filter = 
    +<main.c>
    +<core/*>
    +<profiles/*>
    +<protocols/*>
    +<hal/hal_stm32/*>

[env:nuc131_cbox]
platform = https://github.com/fazerxlo/nuvoton_nuc131.git
board = nuvoton_nuc131
test_ignore = *
build_flags = 
    ${env.build_flags}
    -Iinclude
    -Isrc
    -DPLATFORM_NUC131
    -Wall -Wextra -std=c99 -Wno-unused-parameter -Wno-sign-compare -Wno-empty-body
build_src_filter = 
    +<main.c>
    +<core/*>
    +<profiles/*>
    +<protocols/*>
    +<hal/hal_nuc131/*>
    -<hal/hal_nuc131/startup_app.S>

[env:nuc131_bootloader]
platform = https://github.com/fazerxlo/nuvoton_nuc131.git
board = nuvoton_nuc131
board_build.ldscript = ldscripts/nuc131_bootloader.ld
board_build.custom_startup = yes
test_ignore = *
build_flags = 
    -Iinclude
    -Isrc
    -DPLATFORM_NUC131
    -Wall -Wextra -std=c99 -Wno-unused-parameter -Wno-sign-compare -Wno-empty-body
build_src_filter = 
    +<nuc131_hiworld_bootloader/startup_bootloader.S>
    +<nuc131_hiworld_bootloader/hiworld_iap_nuc131.c>

[env:raise_nuc131]
platform = https://github.com/fazerxlo/nuvoton_nuc131.git
board = nuvoton_nuc131
board_build.ldscript = ldscripts/nuc131_app.ld
board_build.custom_startup = yes
test_ignore = *
build_flags = 
    ${env.build_flags}
    -Iinclude
    -Isrc
    -DPLATFORM_NUC131
    -DAPP_BASE_OFFSET=0x2000
    -Wall -Wextra -std=c99 -Wno-unused-parameter -Wno-sign-compare -Wno-empty-body
build_src_filter = 
    +<hal/hal_nuc131/startup_app.S>
    +<main.c>
    +<core/*>
    +<profiles/*>
    +<protocols/*>
    +<hal/hal_nuc131/*>


